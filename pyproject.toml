[project]
name = "entrela"
version = "0.15.0"
description = "Simulador de qubits em ambientes ruidosos com mitigação"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7,<7",
    "qiskit>=2.4.1,<3",
    "qiskit-aer>=0.17.2,<0.18",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "Pillow>=10,<13",
]

[project.optional-dependencies]
dev = ["pytest>=9.1,<10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "data*", "gui*"]

[project.scripts]
entrela = "gui.application:main"

[tool.setuptools.package-data]
gui = ["assets/*.png", "assets/icons/*"]
