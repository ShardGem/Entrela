name: Tests
on:
  push:
  pull_request:
concurrency:
  group: tests-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
            scale: '1'
          - os: windows-latest
            python: '3.12'
            scale: '1.5'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      QT_SCALE_FACTOR: ${{ matrix.scale }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Qt runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - name: Isolar as dependências da aplicação
        shell: python
        run: |
          import os
          from pathlib import Path
          import venv
          folder = Path('.venv-ci').resolve()
          venv.create(folder, with_pip=True)
          executable_folder = folder / ('Scripts' if os.name == 'nt' else 'bin')
          with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as output:
              output.write(str(executable_folder) + '\n')
      - name: Install
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
          python -m pip install pytest-timeout==2.4.0
      - name: Conferir dependências
        run: python -m pip check
      - name: Verificar as regressões de portabilidade
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: python -m pytest -q -p no:cacheprovider --timeout=240 --timeout-method=thread tests/test_appearance_preferences.py::test_rendered_table_alternate_rows_keep_readable_contrast tests/test_recovery_and_focus.py::test_autosave_runs_before_close_and_falls_back_after_corruption tests/test_workspace_backup.py::test_archive_path_traversal_and_unsafe_windows_names_are_rejected
      - name: Validate
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONDONTWRITEBYTECODE: '1'
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: |
          python -m pytest -v -p no:cacheprovider --timeout=240 --timeout-method=thread --durations=10
      - name: Package and launch outside checkout
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip wheel --no-deps . -w dist
          python scripts/package_smoke.py
