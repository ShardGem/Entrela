name: Tests
on:
  push:
  pull_request:
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
            scale: '1'
          - os: windows-latest
            python: '3.14'
            scale: '1.5'
    runs-on: ${{ matrix.os }}
    env:
      QT_SCALE_FACTOR: ${{ matrix.scale }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Qt runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - name: Install
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
      - name: Validate
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONDONTWRITEBYTECODE: '1'
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: |
          python -m pip check
          python -m pytest -q -p no:cacheprovider
      - name: Package and launch outside checkout
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip wheel --no-deps . -w dist
          python scripts/package_smoke.py dist/entrela-0.17.0-py3-none-any.whl
