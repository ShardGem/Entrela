name: Tests
on:
  push:
  pull_request:
concurrency:
  group: tests-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
            scale: '1'
          - os: windows-latest
            python: '3.12'
            scale: '1.5'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      QT_SCALE_FACTOR: ${{ matrix.scale }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Qt runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - name: Install
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e .
          python -m pip install pytest-timeout==2.4.0
      - name: Validate
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONDONTWRITEBYTECODE: '1'
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: |
          python -m pip check
          python -m pytest -v -p no:cacheprovider --timeout=240 --timeout-method=thread --durations=10
      - name: Package and launch outside checkout
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip wheel --no-deps . -w dist
          python scripts/package_smoke.py
